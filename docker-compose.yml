services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: nfl
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data   # persists data across restarts
      - ./data:/data:ro                   # CSV files accessible for COPY
      - ./db:/db:ro                       # SQL files accessible for init
      - ./db/init/init.sh:/docker-entrypoint-initdb.d/init.sh

  nfl-sync:
    build: .
    volumes:
      - ./data:/app/data

volumes:
  pgdata:
