version: 0.2

env:
  secrets-manager:
    PGHOST: DataWarehouseStackDWSecret9-LIsZAcNXfW4g:host
    PGUSER: DataWarehouseStackDWSecret9-LIsZAcNXfW4g:username
    PGPASSWORD: DataWarehouseStackDWSecret9-LIsZAcNXfW4g:password
    PGPORT: DataWarehouseStackDWSecret9-LIsZAcNXfW4g:port
    PGDATABASE: DataWarehouseStackDWSecret9-LIsZAcNXfW4g:dbname

phases:
  install:
    commands:
      - echo Installing PostgreSQL client
      - apt-get update -y && apt-get install -y postgresql-client
  pre_build:
    commands:
      - echo Preparing to run SQL scripts
  build:
    commands:
      - echo Running SQL scripts in 'schemas' directory
      - find schemas -type f -name "*.sql" -exec psql -f {} \;

      - echo Running SQL scripts in 'tables' directory
      - find tables -type f -name "*.sql" -exec psql -f {} \;

      - echo Running SQL scripts in 'functions' directory
      - find functions -type f -name "*.sql" -exec psql -f {} \;

      - echo Running SQL scripts in 'views' directory
      - find views -type f -name "*.sql" -exec psql -f {} \;

      - echo Running SQL scripts in 'schedules' directory
      - find schedules -type f -name "*.sql" -exec psql -f {} \;
